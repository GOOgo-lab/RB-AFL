name: ci

on:
  push:
  pull_request:

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate configuration and CLI
        run: |
          python -m rbafl --help
          python -m rbafl validate-config --config configs/protocol_50_20_41.json
      - name: Compile source
        run: python -m compileall -q rbafl scripts tests
      - name: Run protocol tests
        run: python -m unittest discover -s tests -v

  full-import-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install full pipeline and tests
        run: python -m pip install -e ".[full,test]"
      - name: Run all tests including balanced quantization
        run: python -m unittest discover -s tests -v

