[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rb-afl"
version = "1.1.0"
description = "Reproducible 50/20/41 evaluation pipeline for RB-AFL geographic-vector zero-watermarking"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "RB-AFL authors"}]
keywords = ["geographic vector data", "zero-watermarking", "reproducibility"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License"
]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scipy>=1.10,<2"
]

[project.optional-dependencies]
full = [
  "torch>=2.0,<3",
  "geopandas>=1.0,<2",
  "shapely>=2.0,<3",
  "rasterio>=1.3,<2",
  "Pillow>=10,<12",
  "openpyxl>=3.1,<4",
  "numba>=0.59,<1",
  "cryptography>=42,<46",
  "matplotlib>=3.8,<4"
]
test = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1"
]

[project.scripts]
rbafl = "rbafl.cli:main"

[tool.setuptools.packages.find]
include = ["rbafl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
